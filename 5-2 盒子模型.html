<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型,box,model</title>
    <style>
        body,h2,ul,p{
            margin: 0;
            padding: 0;
        }
        #a{
            width: 400px;
            height: 400px;
            border:1px solid #000;
            padding: 50px 40px 30px 20px;
            margin: 40px auto;
        }
        #b{
            width: 400px;
            height: 400px;
            border:1px solid #682323;
            padding: 50px 40px 30px 20px;
            margin: 40px auto;
            box-sizing: border-box;
        }
        #c{
            width: 400px;
            height: 400px;
            border:1px solid #93d998;
            padding: 50px 40px 30px 20px;
            margin: 40px auto;
                       box-sizing: border-box;
        }
        #d{
            width: 400px;
            height: 400px;
            border:1px solid #fbf5a9;
            padding: 50px 40px 30px 20px;
            margin: 40px auto;
            box-sizing: border-box;
        }
        /* 扩展：完成其他盒子模型 */
    </style>
</head>
<body>
    <h2>盒子模型、框模型,box,model</h2>
    <div id="a">521 张海玉</div>
    <div id="b">521 张海玉</div>
    <div id="c">521 张海玉</div>
    <div id="d">521 张海玉</div>
</body>
</html>
