<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>521张海玉</title>
    <style>
        p{
            color: rgb(99, 15, 75);
            font-size: 50px;
        }
        /*标签选择器*/
        #box{
            width:600px;
            height: 300px;
            background-color: rgb(232, 149, 149);
        }
        h2{
            color: white;
            background-color: black;
        }
        .selector-word{
            color: white;
        }
        .color-box{
            width: 300px;
            height: 300px;
            background-color: rgb(72, 93, 94);
        }
        .n1{
            color: rgb(20, 177, 183);
            font-size: 50px;
        }
        .n2{
            color: rgb(173, 66, 150);
            font-size: 50px;
        }   
        .n3{
            color: rgb(133, 93, 130);
            font-size: 50px;
        }   
    </style>
</head>
<body>
    <h2>层叠样式表</h2>
    <div id = "box">
                    <!--拓展三：选择器三个字是白色-->
        <p>CSS<span class="selector-word">选择器</span></p>
        <p><span class = "n1">张</span><span class = "n2">海</span><span class = "n3">玉</span></p>
        <P>CSS属性</P>
        <div class="color-box"></div>
    </div>
</body>
</html>
