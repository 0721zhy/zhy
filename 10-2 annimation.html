<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 图片幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #19231f;
            background: linear-gradient(135deg, #f3f1e9, #dce5df);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .gallery {
            width: min(100%, 960px);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #64736a;
            font-size: 13px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 24px;
            font-family: Georgia, "Songti SC", serif;
            font-size: 34px;
            font-weight: 600;
        }

        .slideshow {
            position: relative;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #18211d;
            border-radius: 8px;
            box-shadow: 0 24px 60px rgb(25 35 31 / 20%);
        }

        .slide {
            position: absolute;
            inset: 0;
            margin: 0;
            opacity: 0;
            animation: slideshow 12s infinite;
        }

        .slide:nth-child(2) {
            animation-delay: -4s;
        }

        .slide:nth-child(3) {
            animation-delay: -8s;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide figcaption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 48px 28px 24px;
            color: #fff;
            background: linear-gradient(transparent, rgb(0 0 0 / 72%));
            font-size: 20px;
            font-weight: 600;
        }

        @keyframes slideshow {
            0% {
                opacity: 0;
            }
            3% {
                opacity: 1;
            }
            30% {
                opacity: 1;
            }
            35%, 100% {
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }

            h1 {
                margin-bottom: 18px;
                font-size: 28px;
            }

            .slide figcaption {
                padding: 36px 16px 14px;
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide {
                animation: none;
            }

            .slide:first-child {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main class="gallery">
        <p class="eyebrow">影像档案 / 01—03</p>
        <h1>阅兵影像</h1>
        <section class="slideshow" aria-label="图片幻灯片">
            <figure class="slide">
                <img src="img/1.1.webp" alt="导弹装备与队列">
                <figcaption>装备列阵</figcaption>
            </figure>
            <figure class="slide">
                <img src="img/1.2.webp" alt="阅兵中的导弹运输车队">
                <figcaption>方阵行进</figcaption>
            </figure>
            <figure class="slide">
                <img src="img/1.3.webp" alt="整齐排列的军用车辆">
                <figcaption>装备展示</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
