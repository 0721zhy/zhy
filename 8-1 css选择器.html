﻿<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .zhy_main{
        /* 背景颜色 */
        background-color: rgb(249, 243, 244);
        display: flex;
        flex-wrap: wrap;
    }
    .zhy_box{
        width: 25%;
        height: 200px;
        background-color: aquamarine;
        border: 1px solid red;
        margin: 10px;
        font-size: 14px;
        display: flex;
        /* 水平垂直居中 */
        justify-content: center;
        align-items: center;
        transform: all 0.6s;
        box-sizing: border-box;
    }
    .zhy_box:first-child:hover{
        background-color: rgb(218, 176, 134);
        color: red;
        transform: scale(1.2);
        font-size: 100px;
        border-radius: 30px;
    }
    .zhy_box:nth-child(2n):hover{
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
         .zhy_box:nth-child(3):hover{
            text-shadow:100px 0px 20px rgba(142, 86, 86, 0.5);
        }
        .zhy_box:nth-child(4):hover{
            border-radius:50%;
        }

        .zhy_box:nth-child(5):hover{
            /**/
 background: linear-gradient(45deg, red, yellow, blue); 
        }
        .zhy_box:nth-child(6):hover{
            /* 镜像渐变 */
            background:radial-gradient(circle,red,yellow);
        }
        /* 相邻兄弟选择器 */
        .zhy_box:nth-of-type(6)+.zhy_box:hover{
            transform: scale(1.5);
        }
        .zhy_box:nth-of-type(8):hover{
            transform:translateX(100px);
        }
        .zhy_box:nth-of-type(9):hover{
            transform:rotate(-180deg);
        }
        .zhy_box:nth-of-type(10):hover{
           transform:skewX(30deg);
        }
        .zhy_box:nth-last-child(2):hover{
            content: 'lay';
            color: rgb(205, 130, 220);
        }
        /* 最后一个 */
        .zhy_box:last-child:hover::after{
            content: '张海玉';
            font-size: 20px;
            color: white;
            background-color: black;
            height: 40px;
            min-width: 100px;
            padding: 0 16px;
            margin-left: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 黑底白字，居中圆角，并与盒子内容保持距离 */
        }
        .zhy_box:nth-child(2n):hover{
            border: 3px solid rgb(141, 44, 160);
            background-color: rgb(224, 203, 230);
            transform: translateY(-12px) rotate(3deg);
            border-radius: 20px;
        }
        /* 扩展：偶数个盒子悬停时改变颜色、位置、角度和圆角 */
</style>
<body>
    <!-- 姓名：张海玉 日期：2026-10-22 功能：8-1 css选择器 -->
    <div class="zhy_main">
        <!-- 12个盒子 -->
        <div class="zhy_box">1i</div>
        <div class="zhy_box">2i</div>
        <div class="zhy_box">3i</div>
        <div class="zhy_box">4i</div>
        <div class="zhy_box">5i</div>
        <div class="zhy_box">6i</div>
        <div class="zhy_box">7i</div>
        <div class="zhy_box">8i</div>
        <div class="zhy_box">9i</div>
        <div class="zhy_box">10i</div>
        <div class="zhy_box">11i</div>
        <div class="zhy_box">12i</div>

    </div>
</body>
</html>
