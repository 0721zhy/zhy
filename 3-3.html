﻿<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 姓名：张海玉 日期：2026-10-22 功能：3-3 -->
    <h2>HTML表单from</h2>
    <form action="https://www.huanqiu.com" name="yl">
        <p>
            用户名：<input type="text" name="usernam">
        </p>
        密码：<input type="password" name="password">
        <p>
            <P>
                性别：
                <input type="radio" name="gender" value="male">男
                <input type="radio" name="gender" value="female">女
                <input type="radio" name="gender" value="secret">保密
            </P>
            <p>
                爱好：
                <input type="checkbox" name="hobby" value="sing">唱歌
                <input type="checkbox" name="hobby" value="dance">跳舞
                <input type="checkbox" name="hobby" value="game">游戏
        </p>
        <p>
            籍贯:<select name="birthplace">
                <option value="beijing">北京</option>
                <option value="shanghai">贵州</option>
                <option value="guangzhou">广州</option>
                <option value="shenzhen">深圳</option>
            </select>
        </p>
        <p>
            个人简介：<textarea name="introduction" id="" cols="30" rows="10"></textarea>
        </p>
        出生年月：<input type="date" name="birthdate">
        <p>
            多文件上传：<input type="file" name="files" multiple>
        </p>
        <!--按钮：普通按钮、提交按钮、重置按钮 -->
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">   
        </p>

    </form>
    <!--表单外的按钮-->
    <button>表单外的按钮</button>
</body>
</html>
