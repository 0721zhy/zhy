<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微博 - 首页</title>
    <link rel="stylesheet" href="fonts/iconfont.css">
    <link rel="stylesheet" href="css/zhang_style.css">
    <script src="js/zhang_common.js" defer></script>
    <script src="js/zhang_feed.js" defer></script>
    <script src="js/zhang_index.js" defer></script>
</head>
<body>
<!-- 姓名：张海玉 建立时间：2026-11-09 大模型：GLM-5.3-FlashX 功能：微博网页首页（发微博 + 信息流 + 热搜榜 + 推荐关注） -->

<header class="zhang_topbar">
    <a class="zhang_logo" href="index.html">
        <i class="iconfont icon-faxian1"></i>微博 <small>全栈大项目 · Express + MySQL</small>
    </a>
    <nav class="zhang_nav">
        <a href="index.html" class="zhang_nav--on"><i class="iconfont icon-shouye"></i>首页</a>
        <a href="profile.html?id=1"><i class="iconfont icon-my"></i>个人主页</a>
        <a href="message.html"><i class="iconfont icon-xinxi"></i>消息通知<span class="zhang_nav-badge"></span></a>
        <a href="database.html"><i class="iconfont icon-zengjia"></i>数据库测试</a>
        <a href="chat.html"><i class="iconfont icon-sousuo"></i>AI 聊天</a>
    </nav>
    <div class="zhang_topbar-user">当前用户：张海玉（uid 1）</div>
</header>

<main class="zhang_layout">
    <!-- 左栏：我的信息卡 -->
    <div class="zhang_col zhang_col--left">
        <div class="zhang_card" id="zhang_meCard"><div class="zhang_tip zhang_tip--loading">加载中…</div></div>
        <div class="zhang_card">
            <div class="zhang_card-title"><i class="iconfont icon-gengduo"></i>快捷入口</div>
            <nav style="display:grid;gap:8px;font-size:14px;">
                <a href="profile.html?id=1"><i class="iconfont icon-my"></i> 我的主页</a>
                <a href="message.html"><i class="iconfont icon-xinxi"></i> 消息通知</a>
                <a href="database.html"><i class="iconfont icon-zengjia"></i> 数据库连接测试</a>
            </nav>
        </div>
    </div>

    <!-- 中栏：发微博 + 信息流 -->
    <div class="zhang_col">
        <div class="zhang_card">
            <div class="zhang_composer-box">
                <span id="zhang_composerAvatar"></span>
                <div class="zhang_composer-main">
                    <textarea class="zhang_composer" id="zhang_composer" maxlength="500"
                              placeholder="有什么新鲜事想告诉大家？"></textarea>
                    <img class="zhang_post-img" id="zhang_preview" alt="配图预览" style="display:none">
                    <div class="zhang_composer-foot">
                        <span class="zhang_composer-count" id="zhang_count">0 / 500</span>
                        <select class="zhang_select" id="zhang_imagePick">
                            <option value="">不配图</option>
                            <option value="img/gallery-1.jpg">配图 1 · 星海广场</option>
                            <option value="img/gallery-2.jpg">配图 2 · 青藏线</option>
                            <option value="img/gallery-3.jpg">配图 3 · AI 实验室</option>
                            <option value="img/gallery-4.jpg">配图 4 · 城市夜景</option>
                            <option value="img/gallery-5.jpg">配图 5 · 无人机编队</option>
                            <option value="img/gallery-6.jpg">配图 6 · 橘猫</option>
                        </select>
                        <button class="zhang_btn" id="zhang_publishBtn"><i class="iconfont icon-bianji"></i>发布</button>
                    </div>
                </div>
            </div>
            <div class="zhang_tip" id="zhang_pubTip"></div>
        </div>

        <div class="zhang_card">
            <div class="zhang_tabs">
                <button class="zhang_tab zhang_tab--on" data-tab="all">全部微博</button>
                <button class="zhang_tab" data-tab="following">关注的人</button>
            </div>
            <div class="zhang_tip" id="zhang_feedTip"></div>
            <div id="zhang_feed"></div>
        </div>
    </div>

    <!-- 右栏：热搜榜 + 推荐关注 -->
    <div class="zhang_col zhang_col--right">
        <div class="zhang_card">
            <div class="zhang_card-title"><i class="iconfont icon-sousuo"></i>微博热搜</div>
            <div id="zhang_hotList"><div class="zhang_tip zhang_tip--loading">加载中…</div></div>
        </div>
        <div class="zhang_card">
            <div class="zhang_card-title"><i class="iconfont icon-tuijian"></i>推荐关注</div>
            <div id="zhang_recList"><div class="zhang_tip zhang_tip--loading">加载中…</div></div>
        </div>
    </div>
</main>

<footer class="zhang_footnote">张海玉 · 24001010521 · 《高级网页设计》全栈大项目 · 微博网页（Express + MySQL + 原生前端）</footer>
</body>
</html>
