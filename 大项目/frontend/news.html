<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技新闻 · 图书管理系统</title>
    <!-- 姓名：张海玉 | 学号：24001010521 | 时间：2026-11-09 | 大模型：DeepSeek-V4.1-Flash | 功能：科技新闻列表页（数据存于 MySQL，展示接口连接状态与数据内容） -->
    <link rel="stylesheet" href="fonts/iconfont.css">
    <link rel="stylesheet" href="css/zhang_style.css">
    <style>
        /* 本页私有样式：接口连接状态条 + 新闻卡片列表 */
        .zhang_api-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 22px;
            align-items: center;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 18px;
            border: 1.5px solid var(--zhang_line);
            background: #fff;
        }

        .zhang_api-bar .zhang_api-item { display: flex; align-items: center; gap: 6px; color: var(--zhang_sub); }
        .zhang_api-bar .zhang_api-item b { color: var(--zhang_ink); font-weight: 700; }
        .zhang_api-bar .iconfont { font-size: 15px; }

        .zhang_api-state--ok,
        .zhang_api-state--err { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
        .zhang_api-state--ok { color: #1e7e34; }
        .zhang_api-state--err { color: #c0392b; }

        .zhang_news-list { display: grid; gap: 14px; }

        .zhang_news-item {
            display: block;
            padding: 18px 22px;
            background: #fff;
            border: 1.5px solid var(--zhang_line);
            border-radius: 14px;
            text-decoration: none;
            transition: all .18s;
        }

        .zhang_news-item:hover {
            border-color: var(--zhang_main);
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(29, 93, 143, .13);
        }

        .zhang_news-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            font-size: 12px;
            color: var(--zhang_sub);
            margin-bottom: 10px;
        }

        .zhang_news-item h3 {
            font-size: 17px;
            line-height: 1.6;
            color: var(--zhang_ink);
            margin-bottom: 8px;
        }

        .zhang_news-item p {
            font-size: 13px;
            line-height: 1.85;
            color: var(--zhang_sub);
        }

        .zhang_news-foot {
            margin-top: 12px;
            font-size: 12px;
            color: var(--zhang_sub);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="zhang_topbar">
        <a class="zhang_logo" href="index.html"><i class="iconfont icon-shouye"></i>图书管理系统</a>
        <nav class="zhang_nav">
            <a href="index.html">首页</a>
            <a href="books.html">图书列表</a>
            <a href="news.html" class="zhang_nav--on">科技新闻</a>
            <a href="database.html">数据库测试</a>
        </nav>
        <span class="zhang_topbar-user">张海玉 24001010521</span>
    </header>

    <main class="zhang_wrap">
        <h1 class="zhang_page-title"><i class="iconfont icon-xinxi"></i>科技新闻</h1>
        <p class="zhang_page-sub">新闻数据存放于 MySQL 表 zhang_news，本页通过后端接口读取并在下方展示连接状态与数据内容。</p>

        <!-- 接口连接状态（由 JS 填充） -->
        <div class="zhang_api-bar" id="zhang_apiBar">
            <span class="zhang_api-item"><i class="iconfont icon-xinxi"></i>接口：<b>GET /api/news</b></span>
            <span class="zhang_api-item">状态：<span class="zhang_api-state--err" id="zhang_apiState">连接中…</span></span>
            <span class="zhang_api-item">数据条数：<b id="zhang_apiCount">-</b></span>
            <span class="zhang_api-item">耗时：<b id="zhang_apiMs">-</b></span>
            <span class="zhang_api-item">数据库：<b>zhang_news</b></span>
        </div>

        <!-- 状态提示 -->
        <div class="zhang_tip" id="zhang_tip"></div>

        <!-- 搜索与分类筛选 -->
        <div class="zhang_toolbar">
            <input class="zhang_input zhang_input--search" id="zhang_newsSearch" type="text" placeholder="搜索标题或摘要…">
            <select class="zhang_select" id="zhang_newsCate">
                <option value="">全部分类</option>
            </select>
        </div>

        <!-- 新闻列表 -->
        <section class="zhang_news-list" id="zhang_newsList">
            <div class="zhang_card">加载中…</div>
        </section>
    </main>

    <script src="js/zhang_common.js"></script>
    <script src="js/zhang_news.js"></script>
</body>
</html>
