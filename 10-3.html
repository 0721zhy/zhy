﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体查询与 rem</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            min-width: 280px;
            min-height: 100vh;
            margin: 0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .zhy_screen-box {
            display: grid;
            min-height: 100vh;
            place-content: center;
            padding: 2rem;
            color: #fff;
            text-align: center;
            background-color: #c75b39;
            transition: background-color 300ms ease;
        }

        h1 {
            margin: 0;
            font-size: 3rem;
        }

        p {
            margin: 1rem 0 0;
            font-size: 1.125rem;
        }

        @media (max-width: 480px) {
            html {
                font-size: 14px;
            }

            .zhy_screen-box {
                background-color: #397b70;
            }
        }

        @media (min-width: 481px) and (max-width: 900px) {
            html {
                font-size: 16px;
            }

            .zhy_screen-box {
                background-color: #526b9a;
            }
        }

        @media (min-width: 901px) {
            html {
                font-size: 18px;
            }

            .zhy_screen-box {
                background-color: #c75b39;
            }
        }
    </style>
</head>
<body>
    <!-- 姓名：张海玉 日期：2026-10-22 功能：媒体查询与 rem -->
    <main class="zhy_screen-box">
        <h1>张海玉</h1>
        <p>视口变化时，背景颜色与文字大小也会变化</p>
    </main>
</body>
</html>
