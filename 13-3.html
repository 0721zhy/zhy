<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端底部导航 · iconfont 图标</title>
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: #17212b;
            background:
                linear-gradient(90deg, rgba(29, 93, 143, .045) 1px, transparent 1px),
                linear-gradient(rgba(29, 93, 143, .045) 1px, transparent 1px),
                linear-gradient(135deg, #f3f8f8 0%, #fffdf8 55%, #f9eee8 100%);
            background-size: 32px 32px, 32px 32px, auto;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* ===== 模拟手机容器 ===== */
        .zhy_stage {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 30px rgba(23, 33, 43, .06);
            position: relative;
            overflow: hidden;
        }

        .zhy_statusbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px 6px;
            color: #17212b;
            font-size: 12px;
            font-weight: 700;
        }

        /* ===== 主内容区 ===== */
        .zhy_content {
            padding: 6px 16px 100px;
        }

        .zhy_banner {
            height: 160px;
            margin-bottom: 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1d5d8f 0%, #d86d55 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font: 600 16px/1.5 "Microsoft YaHei", sans-serif;
            box-shadow: 0 4px 14px rgba(29, 93, 143, .25);
        }

        .zhy_grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .zhy_item {
            height: 120px;
            background: #f5f7f8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #63707b;
            gap: 8px;
        }

        .zhy_item i {
            font-size: 30px;
            color: #1d5d8f;
        }

        .zhy_item span {
            font-size: 12px;
        }

        .zhy_feed-title {
            font-size: 15px;
            font-weight: 700;
            margin: 8px 0 10px;
            color: #17212b;
        }

        .zhy_feed {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f3f5;
        }

        .zhy_feed-cover {
            width: 90px;
            height: 66px;
            border-radius: 8px;
            background: linear-gradient(135deg, #dcecf5, #f9eee8);
            flex-shrink: 0;
        }

        .zhy_feed-info {
            flex: 1;
            min-width: 0;
        }

        .zhy_feed-info h3 {
            margin: 0 0 6px;
            font-size: 14px;
            line-height: 1.4;
            color: #17212b;
        }

        .zhy_feed-info p {
            margin: 0;
            font-size: 12px;
            color: #95a5a6;
        }

        /* ===== 底部导航 ===== */
        .zhy_tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: stretch;
            background: #ffffff;
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
            box-shadow: 0 -1px 0 rgba(23, 33, 43, .06);
            z-index: 20;
            border-top: 1px solid #f0f3f5;
        }

        .zhy_tab {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 6px 0 4px;
            color: #9aa6ae;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            transition: color .15s ease;
        }

        .zhy_tab:hover { color: #63707b; }

        .zhy_tab.zhy_active {
            color: #17212b;
        }

        .zhy_tab-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            line-height: 1;
            width: 30px;
            height: 30px;
        }

        .zhy_tab-label {
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
        }

        /* ===== 角标 ===== */
        .zhy_badge {
            position: absolute;
            top: -2px;
            right: -6px;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ff3b30;
            color: #fff;
            box-shadow: 0 0 0 2px #fff;
        }

        /* 数字徽章：消息 */
        .zhy_badge.zhy_badge-num {
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 10px;
            font: 10px/1 "Microsoft YaHei", sans-serif;
            font-weight: 700;
        }

        /* 红点：发现 */
        .zhy_badge.zhy_badge-dot {
            width: 8px;
            height: 8px;
            padding: 0;
            border-radius: 50%;
            top: 0;
            right: 0;
            box-shadow: 0 0 0 2px #fff;
        }

        /* ===== 图标库注释 ===== */
        .zhy_note {
            position: fixed;
            bottom: 70px;
            right: 12px;
            padding: 8px 12px;
            background: #17212b;
            color: #dcecf5;
            font: 11px/1.6 "Consolas", monospace;
            border-radius: 6px;
            max-width: 220px;
            opacity: .55;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 姓名：张海玉 日期：2026-10-22 功能：移动端底部导航 · iconfont 图标 -->

    <div class="zhy_stage">
        <!-- 状态栏 -->
        <div class="zhy_statusbar">
            <span>9:41</span>
            <span>5G ▮▮▮</span>
        </div>

        <!-- 主内容 -->
        <main class="zhy_content">
            <div class="zhy_banner">iconfont 5 项底部导航演示</div>

            <div class="zhy_grid">
                <div class="zhy_item"><i class="iconfont icon-shouye"></i><span>首页</span></div>
                <div class="zhy_item"><i class="iconfont icon-shipin"></i><span>视频</span></div>
                <div class="zhy_item"><i class="iconfont icon-faxian"></i><span>发现</span></div>
                <div class="zhy_item"><i class="iconfont icon-xihuan"></i><span>喜欢</span></div>
            </div>

            <div class="zhy_feed-title">推荐内容</div>

            <div class="zhy_feed">
                <div class="zhy_feed-cover"></div>
                <div class="zhy_feed-info">
                    <h3>iconfont 字体图标的使用方法详解</h3>
                    <p>张海玉 · 3 分钟前</p>
                </div>
            </div>
            <div class="zhy_feed">
                <div class="zhy_feed-cover"></div>
                <div class="zhy_feed-info">
                    <h3>移动端底部导航设计最佳实践</h3>
                    <p>前端专栏 · 10 分钟前</p>
                </div>
            </div>
            <div class="zhy_feed">
                <div class="zhy_feed-cover"></div>
                <div class="zhy_feed-info">
                    <h3>CSS 角标 badge 的几种实现方式</h3>
                    <p>CSS 技巧 · 1 小时前</p>
                </div>
            </div>
        </main>

        <!-- ===== 底部导航：5 个 tab ===== -->
        <nav class="zhy_tabbar" aria-label="底部导航">
            <!-- 首页（激活） -->
            <a class="zhy_tab zhy_active" data-tab="home" href="#">
                <span class="zhy_tab-icon"><i class="iconfont icon-shouye" aria-hidden="true"></i></span>
                <span class="zhy_tab-label">首页</span>
            </a>

            <!-- 视频 -->
            <a class="zhy_tab" data-tab="video" href="#">
                <span class="zhy_tab-icon"><i class="iconfont icon-shipin" aria-hidden="true"></i></span>
                <span class="zhy_tab-label">视频</span>
            </a>

            <!-- 发现（红点） -->
            <a class="zhy_tab" data-tab="discover" href="#">
                <span class="zhy_tab-icon">
                    <i class="iconfont icon-faxian" aria-hidden="true"></i>
                    <span class="zhy_badge zhy_badge-dot" aria-label="有新发现"></span>
                </span>
                <span class="zhy_tab-label">发现</span>
            </a>

            <!-- 消息（数字徽章 408） -->
            <a class="zhy_tab" data-tab="message" href="#">
                <span class="zhy_tab-icon">
                    <i class="iconfont icon-xinxi" aria-hidden="true"></i>
                    <span class="zhy_badge zhy_badge-num" aria-label="408 条未读">408</span>
                </span>
                <span class="zhy_tab-label">消息</span>
            </a>

            <!-- 我 -->
            <a class="zhy_tab" data-tab="me" href="#">
                <span class="zhy_tab-icon"><i class="iconfont icon-my" aria-hidden="true"></i></span>
                <span class="zhy_tab-label">我</span>
            </a>
        </nav>
    </div>

    <script>
        // tab 切换：点击激活
        var zhyTabs = document.querySelectorAll('.zhy_tab');
        var zhyTabName = {
            home:     '首页',
            video:    '视频',
            discover: '发现',
            message:  '消息',
            me:       '我'
        };

        zhyTabs.forEach(function(zhyTab) {
            zhyTab.addEventListener('click', function(zhyEvt) {
                zhyEvt.preventDefault();

                // 清除所有激活态
                zhyTabs.forEach(function(t) { t.classList.remove('zhy_active'); });

                // 当前 tab 激活
                zhyTab.classList.add('zhy_active');

                // 轻提示（console + alert 二选一，这里用 console 更友好）
                var zhyKey = zhyTab.getAttribute('data-tab');
                console.log('[tab] 切换到 →', zhyTabName[zhyKey] || zhyKey);
            });
        });
    </script>
</body>
</html>
