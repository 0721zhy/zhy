<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Animation 动画</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			overflow: hidden;
			background: #f2f1ea;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.color-box {
			display: grid;
			width: min(220px, 60vw);
			aspect-ratio: 1;
			place-items: center;
			color: #fff;
			font-size: 24px;
			font-weight: 700;
			text-shadow: 0 2px 8px rgb(0 0 0 / 25%);
			box-shadow: 0 20px 45px rgb(25 35 31 / 20%);
			animation:
				change-color 8s linear infinite,
				float-and-morph 3s ease-in-out infinite alternate;
		}

		@keyframes change-color {
			0% {
				background-color: #e74c3c;
			}
			25% {
				background-color: #f1c40f;
			}
			50% {
				background-color: #2ecc71;
			}
			75% {
				background-color: #3498db;
			}
			100% {
				background-color: #e74c3c;
			}
		}

		@keyframes float-and-morph {
			from {
				transform: translateY(0) scale(1);
				border-radius: 12px;
			}
			to {
				transform: translateY(-18px) scale(1.06);
				border-radius: 50%;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.color-box {
				animation: none;
				background-color: #e74c3c;
			}
		}
	</style>
</head>
<body>
	<div class="color-box">张海玉</div>
</body>
</html>
