<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 · fetch 获取单个商品</title>
    <!-- 全局样式 + iconfont 字体图标 -->
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        /* =====================================================
           本页私有样式：商品详情页（17-3-detail）
           接口：https://dummyjson.com/products/{id}
           ID 从 URL 参数读取：17-3-detail.html?id=1
           ===================================================== */

        * { box-sizing: border-box; }

        html, body { margin: 0; }

        body {
            min-height: 100vh;
            color: #17212b;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* ---------- 返回列表 ---------- */
        .zhy_back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            padding: 7px 16px;
            background: #fff;
            border: 1.5px solid #1d5d8f;
            border-radius: 18px;
            color: #1d5d8f;
            font: 600 13px "Microsoft YaHei", sans-serif;
            text-decoration: none;
            transition: all .18s ease;
        }

        .zhy_back:hover { background: #1d5d8f; color: #fff; transform: translateX(-3px); }

        .zhy_back .iconfont { font-size: 13px; }

        /* ---------- 状态条 ---------- */
        .zhy_status {
            margin-top: 12px;
            padding: 10px 16px;
            border-left: 3px solid #1d5d8f;
            border-radius: 8px;
            background: #eef5fa;
            color: #1d5d8f;
            font: 600 13px Consolas, "Microsoft YaHei", monospace;
        }

        .zhy_status.zhy_st-ok { background: #eef9f1; border-left-color: #3a9d5d; color: #2f7d4b; }

        .zhy_status.zhy_st-bad { background: #fdf0ee; border-left-color: #d86d55; color: #b04534; }

        /* ---------- 详情主体：左图右文 ---------- */
        .zhy_detail {
            display: grid;
            grid-template-columns: minmax(0, 5fr) minmax(0, 4fr);
            gap: 22px;
            margin-top: 16px;
        }

        /* 左：图片区 */
        .zhy_pic-main {
            position: relative;
            height: 380px;
            background: repeating-conic-gradient(#f4f6f8 0 25%, #fbfcfd 0 50%) 0 0 / 28px 28px;
            border: 1px solid #e3ebf1;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zhy_pic-main img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 22px;
            animation: zhy_fadein .3s ease;
        }

        @keyframes zhy_fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .zhy_pic-thumbs {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .zhy_pic-thumbs img {
            width: 78px;
            height: 78px;
            object-fit: contain;
            padding: 6px;
            background: #fff;
            border: 1.5px solid #e3ebf1;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color .15s ease, transform .15s ease;
        }

        .zhy_pic-thumbs img:hover { transform: translateY(-3px); }

        .zhy_pic-thumbs img.zhy_thumb-on { border-color: #1d5d8f; box-shadow: 0 0 0 2px rgba(29, 93, 143, .18); }

        /* 右：信息区 */
        .zhy_info { display: flex; flex-direction: column; gap: 12px; }

        .zhy_brand-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .zhy_brand {
            padding: 4px 12px;
            background: #eef5fa;
            border-radius: 13px;
            color: #1d5d8f;
            font: 600 12px "Microsoft YaHei", sans-serif;
        }

        .zhy_cate {
            padding: 4px 12px;
            background: #eef9f1;
            border-radius: 13px;
            color: #2f7d4b;
            font: 600 12px "Microsoft YaHei", sans-serif;
        }

        .zhy_pid {
            margin-left: auto;
            color: #98a2ad;
            font: 600 12px Consolas, monospace;
        }

        .zhy_d-title {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.45;
        }

        .zhy_d-desc {
            margin: 0;
            color: #5a6570;
            font-size: 14px;
            line-height: 1.9;
        }

        .zhy_price-card {
            padding: 16px 18px;
            background: #fff7f4;
            border: 1px solid #f6d9cf;
            border-radius: 12px;
        }

        .zhy_price-now {
            color: #d86d55;
            font: 700 32px Consolas, monospace;
        }

        .zhy_price-now::before { content: '$'; font-size: 19px; }

        .zhy_price-old {
            margin-left: 12px;
            color: #98a2ad;
            font: 600 15px Consolas, monospace;
            text-decoration: line-through;
        }

        .zhy_price-tag {
            display: inline-block;
            margin-left: 12px;
            padding: 3px 10px;
            background: #d86d55;
            border-radius: 6px;
            color: #fff;
            font: 700 13px Consolas, monospace;
        }

        .zhy_price-stock { margin-top: 8px; color: #8a6d3b; font-size: 13px; }

        .zhy_price-stock em {
            color: #2f7d4b;
            font-style: normal;
            font-weight: 700;
        }

        /* 评分行 */
        .zhy_rate-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .zhy_rate-star { color: #e8a13a; letter-spacing: 3px; font-size: 20px; }

        .zhy_rate-num { color: #17212b; font: 700 16px Consolas, monospace; }

        .zhy_rate-text { color: #8a97a0; font-size: 13px; }

        /* 标签 */
        .zhy_tags { display: flex; flex-wrap: wrap; gap: 8px; }

        .zhy_tag-item {
            padding: 5px 13px;
            background: #f0f6fb;
            border: 1px solid #cfe3f2;
            border-radius: 15px;
            color: #1d5d8f;
            font-size: 12px;
        }

        /* 操作按钮 */
        .zhy_btn-row { display: flex; gap: 12px; margin-top: 4px; }

        .zhy_btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 24px;
            font: 700 15px "Microsoft YaHei", sans-serif;
            cursor: pointer;
            transition: all .18s ease;
        }

        .zhy_btn-buy {
            background: #d86d55;
            color: #fff;
        }

        .zhy_btn-buy:hover { background: #c2543c; transform: translateY(-2px); }

        .zhy_btn-cart {
            background: #fff;
            border: 1.5px solid #1d5d8f;
            color: #1d5d8f;
        }

        .zhy_btn-cart:hover { background: #1d5d8f; color: #fff; transform: translateY(-2px); }

        /* ---------- 加载与错误占位 ---------- */
        .zhy_skeleton {
            margin-top: 16px;
            height: 420px;
            border-radius: 14px;
            background: linear-gradient(100deg, #eef1f5 40%, #f7f9fb 50%, #eef1f5 60%);
            background-size: 200% 100%;
            animation: zhy_shine 1.1s linear infinite;
        }

        @keyframes zhy_shine {
            to { background-position: -200% 0; }
        }

        @media (max-width: 760px) {
            .zhy_detail { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 姓名：张海玉 建立时间：2026-11-02 大模型：GLM-5.3-FlashX 功能：商品详情 · 根据 URL 参数中的 ID fetch 单个商品接口 -->

    <div class="zhy_page">
        <a class="zhy_back" href="17-3.html"><i class="iconfont icon-shouye" aria-hidden="true"></i> 返回商品列表</a>

        <section class="zhy_section" style="margin-top:8px">
            <div class="zhy_status" data-zhy-status>⏳ 正在读取商品 ID 并请求接口…</div>

            <div class="zhy_detail" data-zhy-detail hidden>
                <!-- 左：主图 + 缩略图（JS 填充） -->
                <div>
                    <div class="zhy_pic-main"><img data-zhy-main src="" alt="商品主图"></div>
                    <div class="zhy_pic-thumbs" data-zhy-thumbs></div>
                </div>

                <!-- 右：商品信息（JS 填充） -->
                <div class="zhy_info">
                    <div class="zhy_brand-line">
                        <span class="zhy_brand" data-zhy-brand>-</span>
                        <span class="zhy_cate" data-zhy-cate>-</span>
                        <span class="zhy_pid" data-zhy-pid>ID -</span>
                    </div>
                    <h2 class="zhy_d-title" data-zhy-title>加载中…</h2>
                    <p class="zhy_d-desc" data-zhy-desc></p>

                    <div class="zhy_rate-row">
                        <span class="zhy_rate-star" data-zhy-star>★★★★★</span>
                        <span class="zhy_rate-num" data-zhy-rate>-</span>
                        <span class="zhy_rate-text">用户评分</span>
                    </div>

                    <div class="zhy_price-card">
                        <span class="zhy_price-now" data-zhy-price>-</span>
                        <span class="zhy_price-old" data-zhy-old hidden></span>
                        <span class="zhy_price-tag" data-zhy-off hidden></span>
                        <div class="zhy_price-stock" data-zhy-stock>库存：-</div>
                    </div>

                    <div class="zhy_tags" data-zhy-tags></div>

                    <div class="zhy_btn-row">
                        <button type="button" class="zhy_btn zhy_btn-buy" data-zhy-action="buy">立即购买</button>
                        <button type="button" class="zhy_btn zhy_btn-cart" data-zhy-action="cart">加入购物车</button>
                    </div>
                </div>
            </div>

            <div class="zhy_skeleton" data-zhy-skeleton></div>
        </section>
    </div>

    <script>
        // ============================================================
        // 姓名：张海玉（zhy）  功能：fetch 商品详情接口
        // 命名约定：全部变量使用 zhy_ 前缀；通过类选择器获取元素，不使用 id
        // ============================================================

        /* ---------- 从 URL 参数读取商品 ID：17-3-detail.html?id=1 ---------- */
        var zhyParams = new URLSearchParams(location.search);
        var zhyId = zhyParams.get('id') || '1';
        var ZHY_API = 'https://dummyjson.com/products/' + encodeURIComponent(zhyId);

        var zhyStatus = document.querySelector('[data-zhy-status]');
        var zhySkeleton = document.querySelector('[data-zhy-skeleton]');
        var zhyDetail = document.querySelector('[data-zhy-detail]');
        var zhyMainImg = document.querySelector('[data-zhy-main]');

        /* ---------- 分类名转中文 ---------- */
        var zhyCateMap = {
            smartphones: '手机',
            laptops: '笔记本电脑',
            fragrances: '香水',
            skincare: '护肤',
            groceries: '食品杂货',
            'home-decoration': '家居装饰',
            furniture: '家具',
            tops: '上装',
            'womens-dresses': '女装',
            'womens-shoes': '女鞋',
            'mens-shirts': '男装',
            'mens-shoes': '男鞋',
            'mens-watches': '男表',
            'womens-watches': '女表',
            'womens-bags': '女包',
            'womens-jewellery': '首饰',
            sunglasses: '太阳镜',
            automotive: '汽车用品',
            motorcycle: '摩托车',
            lighting: '照明'
        };

        /* ---------- 多图切换 ---------- */
        function zhyBindThumbs(zhyImages) {
            var zhyThumbBox = document.querySelector('[data-zhy-thumbs]');
            zhyThumbBox.innerHTML = '';
            Array.prototype.forEach.call(zhyImages, function (zhySrc, zhyI) {
                var zhyT = document.createElement('img');
                zhyT.src = zhySrc;
                zhyT.alt = '商品图 ' + (zhyI + 1);
                if (zhyI === 0) {
                    zhyT.classList.add('zhy_thumb-on');
                }
                zhyT.addEventListener('click', function () {
                    zhyMainImg.src = zhySrc;
                    Array.prototype.forEach.call(zhyThumbBox.children, function (zhyEl) {
                        zhyEl.classList.remove('zhy_thumb-on');
                    });
                    zhyT.classList.add('zhy_thumb-on');
                    console.log('[17-3-detail] 切换到第 ' + (zhyI + 1) + ' 张图');
                });
                zhyThumbBox.appendChild(zhyT);
            });
        }

        /* ---------- 渲染详情 ---------- */
        function zhyRender(zhyG) {
            zhyMainImg.src = zhyG.thumbnail || (zhyG.images && zhyG.images[0]) || '';
            zhyMainImg.alt = zhyG.title;
            zhyBindThumbs(zhyG.images && zhyG.images.length ? zhyG.images : [zhyG.thumbnail]);

            document.querySelector('[data-zhy-brand]').textContent = zhyG.brand || '无品牌';
            document.querySelector('[data-zhy-cate]').textContent = zhyCateMap[zhyG.category] || zhyG.category;
            document.querySelector('[data-zhy-pid]').textContent = 'ID ' + zhyG.id;
            document.querySelector('[data-zhy-title]').textContent = zhyG.title;
            document.querySelector('[data-zhy-desc]').textContent = zhyG.description || '';

            var zhyRound = Math.round(zhyG.rating);
            document.querySelector('[data-zhy-star]').textContent =
                '★★★★★'.slice(0, zhyRound) + '☆☆☆☆☆'.slice(0, 5 - zhyRound);
            document.querySelector('[data-zhy-rate]').textContent = zhyG.rating.toFixed(2);

            document.querySelector('[data-zhy-price]').textContent = zhyG.price.toFixed(2);
            var zhyOld = document.querySelector('[data-zhy-old]');
            var zhyOff = document.querySelector('[data-zhy-off]');
            if (zhyG.discountPercentage) {
                zhyOld.textContent = '$' + (zhyG.price / (zhyG.discountPercentage / 100)).toFixed(2);
                zhyOld.hidden = false;
                zhyOff.textContent = '-' + Math.round(zhyG.discountPercentage) + '%';
                zhyOff.hidden = false;
            }
            document.querySelector('[data-zhy-stock]').innerHTML =
                '库存：<em>' + zhyG.stock + '</em> 件　·　剩余 ' + (zhyG.stock < 20 ? '不多，抓紧下单' : '充足');

            var zhyTagBox = document.querySelector('[data-zhy-tags]');
            zhyTagBox.innerHTML = '';
            Array.prototype.forEach.call(zhyG.tags || [], function (zhyTag) {
                var zhySpan = document.createElement('span');
                zhySpan.className = 'zhy_tag-item';
                zhySpan.textContent = zhyTag;
                zhyTagBox.appendChild(zhySpan);
            });
        }

        /* ---------- 核心：fetch 单个商品 ---------- */
        async function zhyLoadDetail() {
            try {
                var zhyResp = await fetch(ZHY_API);
                if (!zhyResp.ok) {
                    throw new Error('HTTP ' + zhyResp.status + '（可能是 ID 不存在）');
                }
                var zhyG = await zhyResp.json();
                console.log('[17-3-detail] 接口响应：', zhyG);
                zhyRender(zhyG);
                zhySkeleton.hidden = true;
                zhyDetail.hidden = false;
                zhyStatus.className = 'zhy_status zhy_st-ok';
                zhyStatus.textContent = '✓ 请求成功：' + zhyResp.status + '，商品「' + zhyG.title + '」加载完成（ID=' + zhyG.id + '）';
            } catch (zhyError) {
                zhyStatus.className = 'zhy_status zhy_st-bad';
                zhyStatus.textContent = '✗ 请求失败：' + zhyError.message + '（请从列表页点击进入，或检查网络）';
                zhySkeleton.hidden = true;
                console.error('[17-3-detail]', zhyError);
            }
        }

        /* ---------- 购买 / 购物车按钮 ---------- */
        Array.prototype.forEach.call(document.querySelectorAll('[data-zhy-action]'), function (zhyBtn) {
            zhyBtn.addEventListener('click', function () {
                var zhyName = document.querySelector('[data-zhy-title]').textContent;
                console.log('[17-3-detail]', zhyBtn.textContent, '→', zhyName);
                zhyBtn.textContent = zhyBtn.getAttribute('data-zhy-action') === 'buy' ? '已下单 ✓' : '已加入 ✓';
                setTimeout(function () {
                    zhyBtn.textContent = zhyBtn.getAttribute('data-zhy-action') === 'buy' ? '立即购买' : '加入购物车';
                }, 1200);
            });
        });

        zhyLoadDetail();
        console.log('[17-3-detail] 张海玉：商品详情页加载完成，请求 ID =', zhyId);
    </script>
</body>
</html>
